<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snow Desk · Beaver Creek</title>
<meta name="description" content="Beaver Creek's grooming report, weather, snow forecast and snow stake cam, every morning.">
<meta name="theme-color" content="#3a2410">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
  // Apply the saved theme before first paint so there's no flash.
  // Amber Lens is the starting theme; "auto" follows the phone (Corduroy / Night Cat).
  (function () { var t = "amberlens", m = "flat";
    try { t = localStorage.getItem("theme") || t; m = localStorage.getItem("material") || m; } catch (e) {}
    if (t !== "auto") document.documentElement.dataset.theme = t;
    if (m !== "flat") document.documentElement.dataset.material = m; })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500;600&family=Barlow:wght@600;700&display=swap">
<link rel="preload" href="/data/latest.json" as="fetch" crossorigin>
<link rel="stylesheet" href="/themes.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Beaver Creek</h1>
      <span class="sub" id="subtitle">Snow Desk</span>
    </div>
    <button class="icon-btn" id="theme-btn" type="button" aria-label="Change theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/><circle cx="12" cy="12" r="3" fill="var(--surface)"/></svg>
    </button>
  </div>
</header>

<main class="wrap" id="main" aria-live="polite">
  <div class="skeleton"></div><div class="skeleton"></div>
</main>

<div class="tabbar">
  <nav aria-label="Sections">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 19 10 7l4 6 2-3 5 9Z"/></svg>Today</a>
    <a href="#calendar" data-tab="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</a>
    <a href="#forecast" data-tab="forecast">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12M10 20V8M15 20v-6M20 20V5"/></svg>Forecast</a>
    <a href="#help" data-tab="help" class="help-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 7.5v9M7.5 12h9"/></svg>Help</a>
  </nav>
</div>

<div id="tip" class="tip" hidden></div>
<div id="overlay"></div>
<script src="/app.js" defer></script>
</body>
</html>
