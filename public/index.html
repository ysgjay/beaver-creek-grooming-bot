<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chair 0: Snow Desk</title>
<meta name="description" content="Grooming report, weather, snow forecast and cams for Beaver Creek, Vail and other Colorado resorts, every morning.">
<meta name="theme-color" content="#dcebfa">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
  // Set the look before first paint so there's no flash: always Bluebird (light) with the Frost finish.
  document.documentElement.dataset.theme = "bluebird";
  document.documentElement.dataset.material = "frost";
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500;600&family=Outfit:wght@600;700&display=swap">
<link rel="stylesheet" href="/themes.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Beaver Creek</h1>
      <select id="resort-select" class="resort-select" aria-label="Resort" hidden></select>
      <span class="sub" id="subtitle">Chair 0: Snow Desk</span>
    </div>
    <div class="top-status status-line" id="top-status"></div>
    <button class="btn top-cta" id="signup-btn" type="button" aria-label="Sign up for the morning report by email or notification" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m3.5 7.5 8.5 6 8.5-6"/></svg>
      <span class="cta-long">Get the morning report</span><span class="cta-short">Sign up</span>
    </button>
  </div>
</header>

<main class="wrap" id="main" aria-live="polite">
  <div class="skeleton"></div><div class="skeleton"></div>
</main>

<div class="tabbar">
  <nav aria-label="Sections">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 19 10 7l4 6 2-3 5 9Z"/></svg>Today</a>
    <a href="#calendar" data-tab="calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</a>
    <a href="#forecast" data-tab="forecast">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12M10 20V8M15 20v-6M20 20V5"/></svg>Forecast</a>
    <a href="#help" data-tab="help" class="help-tab">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="M12 7.5v9M7.5 12h9"/></svg>Help</a>
  </nav>
</div>

<div id="tip" class="tip" hidden></div>
<div id="overlay"></div>
<script src="/app.js" defer></script>
</body>
</html>
