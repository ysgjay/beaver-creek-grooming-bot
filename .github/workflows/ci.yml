name: CI
# Unit tests only. The app runs on Vercel + Cloudflare; GitHub just holds the code.
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: node --check public/app.js && node --check public/sw.js && node --check cloudflare/worker.js
