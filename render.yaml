# Render blueprint for the 0xM Studio workspace (never the Brassie one). See docs/RENDER.md.
# Region oregon: Open-Meteo's open data lives in AWS us-west-2, so reads stay close.
services:
  # Self-hosted Open-Meteo. Reads model files on demand from Open-Meteo's open data on AWS
  # and keeps what it has read in a cache file on the disk, so it only ever holds the models
  # and places we ask for (US and Canada resorts). Private: reachable only inside Render.
  - type: pserv
    name: snow-meteo
    runtime: image
    image:
      url: ghcr.io/open-meteo/open-meteo:1.8.0
    plan: standard
    region: oregon
    disk:
      name: meteo-data
      mountPath: /app/data
      sizeGB: 40
    envVars:
      - key: REMOTE_DATA_DIRECTORY
        value: https://openmeteo.s3.amazonaws.com/data/
      - key: CACHE_SIZE
        value: 30GB
      - key: API_BIND
        value: 0.0.0.0:8080
      - key: PORT
        value: "8080"

  # Resort readers and the daily pipeline, off Vercel's 60 s limit. Starts in shadow mode:
  # reads the live archive, writes only to its own folder, never sends.
  - type: worker
    name: snow-worker
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python -m bcbot.worker
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: WORKER_MODE
        value: shadow
      - key: WORKER_CONCURRENCY
        value: "4"
      - key: OPEN_METEO_HOSTPORT
        fromService:
          type: pserv
          name: snow-meteo
          property: hostport
      - key: BLOB_PUBLIC_BASE
        sync: false
      # Needed only for live mode (same values as in Vercel); leave empty while in shadow.
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: SNOWDB_DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: ADMIN_NTFY_TOPIC
        sync: false
